[tox]
envlist = py311

[testenv]
deps =
    black
    flake8
    pydocstyle
    pytest
    pytest-black
    pytest-clarity
    pytest-dotenv
    pytest-flake8
    pytest-flask

passenv =
    TEST_DATABASE_URL
    DATABASE_URL
    SECRET_KEY

commands = pytest
usedevelop = true

[flake8]
max-line-length = 89
