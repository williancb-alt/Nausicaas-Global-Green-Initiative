name: Prod env scheduled destroy (for Azure cost optimisation)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  destroy_app:
    name: Destroy prod app layer (envs/production)
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      layer: app
      environment: production
      action: destroy
    secrets: inherit

  destroy_core:
    name: Destroy production core layer (cores/production)
    needs: [destroy_app]
    if: always()
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      layer: core
      environment: production
      action: destroy
    secrets: inherit
