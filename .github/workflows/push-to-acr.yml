name: Build and Push Images to ACR

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      BACKEND_BASE_URL:  ${{ vars.BACKEND_BASE_URL }}
      FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Set ACR name
        id: acr
        run: |
          if [ "$ENVIRONMENT" = "staging" ]; then
            echo "name=nausicaasacrstaging12345" >> "$GITHUB_OUTPUT"
          else
            echo "name=nausicaasacrprod12345" >> "$GITHUB_OUTPUT"
          fi

      - name: ACR login
        run: |
          az acr login --name ${{ steps.acr.outputs.name }}

      - name: Build & push backend
        run: |
          ACR="${{ steps.acr.outputs.name }}.azurecr.io"
          docker build -t "$ACR/backend:${ENVIRONMENT}" ./backend
          docker push "$ACR/backend:${ENVIRONMENT}"

      - name: Build & push frontend
        run: |
          ACR="${{ steps.acr.outputs.name }}.azurecr.io"

          docker build \
            --build-arg VITE_API_BASE_URL="$BACKEND_BASE_URL" \
            --build-arg SERVER_NAME="$FRONTEND_BASE_URL" \
            -t "$ACR/frontend:${ENVIRONMENT}" ./frontend

          docker push "$ACR/frontend:${ENVIRONMENT}"