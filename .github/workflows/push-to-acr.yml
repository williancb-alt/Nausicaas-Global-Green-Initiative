name: Build and Push Images to ACR

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
  workflow_call:
    inputs:
      environment:
        description: "staging or production"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }} 
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build & push backend
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          docker build -t "$ACR/backend:${ENVIRONMENT}" ./backend
          docker push "$ACR/backend:${ENVIRONMENT}"

      - name: Build & push frontend
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"

          docker build \
            --build-arg VITE_API_BASE_URL="${{ secrets.BACKEND_BASE_URL }}" \
            --build-arg SERVER_NAME="${{ secrets.FRONTEND_BASE_URL }}" \
            -t "$ACR/frontend:${ENVIRONMENT}" ./frontend

          docker push "$ACR/frontend:${ENVIRONMENT}"