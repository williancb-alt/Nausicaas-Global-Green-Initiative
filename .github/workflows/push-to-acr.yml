name: Build and Push Images to ACR

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      tag:
        description: "Optional image tag override (e.g. 1.2.3). If empty, uses env name."
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: "staging or production"
        required: true
        type: string
      tag:
        description: "Optional image tag override (e.g. 1.2.3). If empty, uses env name."
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || github.event.inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment || github.event.inputs.environment }}
      IMAGE_TAG: ${{ inputs.tag || github.event.inputs.tag || inputs.environment || github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Cache Grype binary
        id: grype-cache
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/grype
          key: grype-${{ runner.os }}

      - name: Install Grype
        if: steps.grype-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://get.anchore.io/grype | sudo sh -s -- -b /usr/local/bin

      - name: Build backend image
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          docker build -t "$ACR/backend:${IMAGE_TAG}" ./backend

      - name: Scan backend image with Grype
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          grype "$ACR/backend:${IMAGE_TAG}" --fail-on high

      - name: Push backend image
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          docker push "$ACR/backend:${IMAGE_TAG}"

      - name: Build frontend image
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          docker build \
            --build-arg VITE_API_BASE_URL="${{ secrets.BACKEND_BASE_URL }}" \
            --build-arg SERVER_NAME="${{ secrets.FRONTEND_BASE_URL }}" \
            -t "$ACR/frontend:${IMAGE_TAG}" ./frontend

      - name: Scan frontend image with Grype
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          grype "$ACR/frontend:${IMAGE_TAG}" --fail-on high

      - name: Push frontend image
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          docker push "$ACR/frontend:${IMAGE_TAG}"
