name: Build and Push Images to ACR

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      tag:
        description: "Optional image tag override (e.g. 1.2.3). If empty, uses env name."
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: "staging or production"
        required: true
        type: string
      tag:
        description: "Optional image tag override (e.g. 1.2.3). If empty, uses env name."
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || github.event.inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment || github.event.inputs.environment }}
      IMAGE_TAG: ${{ inputs.tag || github.event.inputs.tag || inputs.environment || github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Cache Grype binary
        id: grype-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/grype
          key: grype-${{ runner.os }}

      - name: Install Grype
        if: steps.grype-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.tool_cache }}/grype"
          curl -sSfL https://get.anchore.io/grype | sh -s -- -b "${{ runner.tool_cache }}/grype"

      - name: Add Grype to PATH
        run: echo "${{ runner.tool_cache }}/grype" >> $GITHUB_PATH

      - name: Cache Syft binary
        id: syft-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/syft
          key: syft-${{ runner.os }}

      - name: Install Syft
        if: steps.syft-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.tool_cache }}/syft"
          curl -sSfL https://get.anchore.io/syft | sh -s -- -b "${{ runner.tool_cache }}/syft"

      - name: Add Syft to PATH
        run: echo "${{ runner.tool_cache }}/syft" >> $GITHUB_PATH

      - name: Build backend image
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          docker build -t "$ACR/backend:${IMAGE_TAG}" ./backend

      - name: Scan backend image with Grype
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          grype "$ACR/backend:${IMAGE_TAG}" --only-fixed --fail-on high

      - name: Push backend image
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          docker push "$ACR/backend:${IMAGE_TAG}"

      - name: Build frontend image
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          docker build \
            --build-arg VITE_API_BASE_URL="${{ secrets.BACKEND_BASE_URL }}" \
            --build-arg SERVER_NAME="${{ secrets.FRONTEND_BASE_URL }}" \
            --build-arg VITE_ENVIRONMENT="${ENVIRONMENT}" \
            --build-arg VITE_SENTRY_UI_DSN="${{ secrets.VITE_SENTRY_UI_DSN }}" \
            --build-arg VITE_APP_VERSION="${IMAGE_TAG}" \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --build-arg SENTRY_ORG="${{ vars.SENTRY_ORG }}" \
            --build-arg SENTRY_PROJECT="${{ vars.SENTRY_PROJECT }}" \
            -t "$ACR/frontend:${IMAGE_TAG}" ./frontend

      - name: Scan frontend image with Grype
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          grype "$ACR/frontend:${IMAGE_TAG}" --only-fixed --fail-on high

      - name: Push frontend image
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          docker push "$ACR/frontend:${IMAGE_TAG}"

      - name: Generate backend SBOM
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          syft "$ACR/backend:${IMAGE_TAG}" -o cyclonedx-json > backend-sbom.cdx.json

      - name: Generate frontend SBOM
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io"
          syft "$ACR/frontend:${IMAGE_TAG}" -o cyclonedx-json > frontend-sbom.cdx.json

      - name: Generate source SBOM
        run: |
          syft dir:. -o cyclonedx-json > source-sbom.cdx.json

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ env.IMAGE_TAG }}
          path: |
            backend-sbom.cdx.json
            frontend-sbom.cdx.json
            source-sbom.cdx.json
